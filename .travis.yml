dist: jammy

services:
  - docker

install: true

env:
  global:
    - VERSION=0.3
    - DMAINREPO=$DOCKER_NAMESPACE/pongclone

jobs:
  include:
    - stage: build docker image
      script:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - docker buildx create --use --name pongclone-builder
      - >-
        docker buildx build --push
        --tag $DMAINREPO:$VERSION
        --tag $DMAINREPO:latest
        --tag $DMAINREPO:travis-$TRAVIS_BUILD_NUMBER
        --file Dockerfile .
    - stage: test docker image
      script:
      - docker run -d --name test_pongclone $DMAINREPO:$VERSION
      - docker ps | grep -q test_pongclone
