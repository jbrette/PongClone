name: docker

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  VERSION: "0.3"
  IMAGE: ${{ vars.DOCKER_NAMESPACE }}/pongclone

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_CREDS: ${{ secrets.DOCKER_PASSWORD != '' && vars.DOCKER_NAMESPACE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pongclone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1

      # The game blocks on its first setup prompt, so a container that is
      # still running after a few seconds has started up successfully.
      - name: Test image
        run: |
          docker run -d --name test_pongclone \
            -e DISPLAY=:99 -v /tmp/.X11-unix:/tmp/.X11-unix pongclone:ci
          sleep 5
          docker logs test_pongclone
          docker ps | grep -q test_pongclone
          docker rm -f test_pongclone

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && env.HAS_DOCKER_CREDS == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push' && env.HAS_DOCKER_CREDS == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:gh-${{ github.run_number }}
          cache-from: type=gha
